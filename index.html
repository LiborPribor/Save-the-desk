<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON KNOT - One-Line Knot Challenge</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --text-main: #c5c6c7;
            --neon-blue: #66fcf1;
            --neon-pink: #ff007f;
            --neon-purple: #b026ff;
            --neon-green: #45f3ff;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .lang-switch {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 5px;
            z-index: 10;
        }

        .lang-btn {
            background: #121720;
            border: 1px solid #333;
            color: #888;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .lang-btn.active {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            box-shadow: 0 0 5px rgba(102, 252, 241, 0.3);
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        header {
            text-align: center;
            width: 100%;
            margin-top: 15px;
        }

        h1 {
            font-size: 28px;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue);
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: var(--border-radius);
            border: 1px solid #334556;
            font-size: 14px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-value {
            font-weight: bold;
            color: #fff;
            font-size: 16px;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: #121720;
            border-radius: var(--border-radius);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 15px rgba(102, 252, 241, 0.1);
            border: 2px solid #1f2833;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .btn {
            background: linear-gradient(45deg, #1f2833, #0b0c10);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 12px 24px;
            border-radius: var(--border-radius);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.2);
            width: 100%;
            text-align: center;
        }

        .btn:active {
            transform: scale(0.98);
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.5);
        }

        .btn:disabled {
            border-color: #444;
            color: #444;
            box-shadow: none;
            cursor: not-allowed;
        }

        .leaderboard {
            width: 100%;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 15px;
            border: 1px solid #334556;
        }

        .leaderboard h2 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #fff;
            border-bottom: 1px solid #334556;
            padding-bottom: 5px;
        }

        .lb-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .lb-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 4px 0;
            border-bottom: 1px solid #2a3441;
            align-items: center;
        }

        .lb-item:last-child { border-bottom: none; }
        .lb-rank { width: 20px; color: #888; }
        .lb-name { flex-grow: 1; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 10px; }
        .lb-score { color: var(--neon-blue); font-weight: bold; }
        
        .lb-thumb {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            margin-right: 8px;
            background: #000;
            border: 1px solid #444;
            cursor: pointer;
            object-fit: contain;
        }

        .referral-box {
            background: rgba(102, 252, 241, 0.05);
            border: 1px dashed var(--neon-blue);
            padding: 10px;
            border-radius: var(--border-radius);
            width: 100%;
            text-align: center;
            font-size: 12px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 2px solid var(--neon-blue);
            border-radius: var(--border-radius);
            padding: 20px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px rgba(102, 252, 241, 0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal input {
            background: #121720;
            border: 1px solid #334556;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
        }

        .modal img {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid #334556;
        }
    </style>
</head>
<body>

    <div class="lang-switch">
        <button class="lang-btn active" id="btn-cs" onclick="setLanguage('cs')">CZ</button>
        <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">EN</button>
    </div>

    <div class="container">
        <header>
            <h1>NEON KNOT</h1>
            <p class="subtitle" id="t-subtitle">Denní výzva v kreslení uzlu</p>
        </header>

        <div class="stats-bar">
            <div class="stat-item">
                <span style="color:#888;" id="t-attempts-label">Tahů dnes</span>
                <span class="stat-value" id="attempts-val">1/1</span>
            </div>
            <div class="stat-item">
                <span style="color:#888;" id="t-streak-label">Série</span>
                <span class="stat-value" id="streak-val" style="color:var(--neon-pink)">0 dnů</span>
            </div>
            <div class="stat-item">
                <span style="color:#888;" id="t-best-label">Osobní max</span>
                <span class="stat-value" id="best-val" style="color:var(--neon-green)">0%</span>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="gameCanvas"></canvas>
        </div>

        <button class="btn" id="submitBtn" disabled onclick="submitAttempt()" id="t-submit">Vyhodnotit pokus</button>

        <div class="referral-box" id="refBox">
            <span id="t-ref-text">Pozvi kámoše a získej <b>+1 tah zdarma</b>! Váš odkaz:</span><br>
            <strong id="refLink" style="color:var(--neon-blue); cursor:pointer; word-break: break-all;" onclick="copyRefLink()">Načítání...</strong>
        </div>

        <div class="leaderboard">
            <h2 id="t-lb-title">Dnešní TOP 10 Hráčů</h2>
            <ul class="lb-list" id="leaderboardList">
                <li class="lb-item" style="justify-content:center; color:#666;" id="t-lb-loading">Načítání žebříčku...</li>
            </ul>
            <div style="font-size:11px; color:#666; text-align:center; margin-top:10px;">
                <span id="t-global-total">Celkem odehráno tahů komunitou:</span> <b id="globalTotalAttempts">0</b>
            </div>
        </div>
    </div>

    <!-- Modal pro výsledek -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2 style="color:#fff;" id="t-res-title">Výsledek</h2>
            <div style="font-size: 36px; font-weight: bold; color: var(--neon-blue);" id="resScore">0%</div>
            <p style="font-size:14px; color:#aaa;" id="resText"></p>
            <input type="text" id="playerName" placeholder="Tvoje jméno/Neznámý" maxlength="15">
            <button class="btn" onclick="saveResult()" id="t-save-btn">Uložit do žebříčku</button>
        </div>
    </div>

    <!-- Modal pro náhled obrázku z žebříčku -->
    <div class="modal" id="imageModal" onclick="this.style.display='none'">
        <div class="modal-content">
            <img id="previewImg" src="" alt="Drawing preview">
            <p style="font-size:12px; color:#888;" id="t-close-modal">Kliknutím zavřeš</p>
        </div>
    </div>

    <script>
        // --- JAZYKOVÉ MUTACE ---
        const TRANSLATIONS = {
            cs: {
                subtitle: "Denní výzva v kreslení jednoho tahu",
                attempts: "Tahů dnes",
                streak: "Série",
                best: "Osobní max",
                submit: "Vyhodnotit pokus",
                refText: "Pozvi někoho a získej +1 tah zdarma pro dnešek za každého! Váš odkaz:",
                copied: "Odkaz zkopírován do schránky!",
                lbTitle: "Dnešní TOP 10 Hráčů",
                lbLoading: "Načítání žebříčku...",
                globalTotal: "Celkem odehráno tahů komunitou:",
                resTitle: "Výsledek",
                resTextSuccess: "Skvělá práce! Tvoje přesnost tvaru byla vyhodnocena.",
                resTextNoAttempts: "Dnes už nemáš žádné další pokusy. Přijď zase zítra!",
                saveBtn: "Uložit do žebříčku",
                closeModal: "Kliknutím zavřeš",
                placeholderName: "Tvoje jméno",
                noAttemptsAlert: "Dnes už nemáš žádné další pokusy! Vrat se zítra nebo pozvi kamaráda.",
                days: "dnů"
            },
            en: {
                subtitle: "Daily One-Line Knot Drawing Challenge",
                attempts: "Attempts today",
                streak: "Streak",
                best: "Personal best",
                submit: "Submit Attempt",
                refText: "Invite a friend & get +1 free attempt for today! Your link:",
                copied: "Link copied to clipboard!",
                lbTitle: "Today's TOP 10 Players",
                lbLoading: "Loading leaderboard...",
                globalTotal: "Total community attempts:",
                resTitle: "Result",
                resTextSuccess: "Great job! Your shape accuracy has been evaluated.",
                resTextNoAttempts: "No more attempts today. Come back tomorrow!",
                saveBtn: "Save to Leaderboard",
                closeModal: "Click to close",
                placeholderName: "Your name",
                noAttemptsAlert: "No more attempts today! Come back tomorrow or invite a friend.",
                days: "days"
            }
        };

        let currentLang = 'cs';

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('btn-cs').classList.toggle('active', lang === 'cs');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            
            const t = TRANSLATIONS[lang];
            document.getElementById('t-subtitle').innerText = t.subtitle;
            document.getElementById('t-attempts-label').innerText = t.attempts;
            document.getElementById('t-streak-label').innerText = t.streak;
            document.getElementById('t-best-label').innerText = t.best;
            document.getElementById('submitBtn').innerText = t.submit;
            document.getElementById('t-ref-text').innerHTML = t.refText;
            document.getElementById('t-lb-title').innerText = t.lbTitle;
            document.getElementById('t-global-total').innerText = t.globalTotal;
            document.getElementById('t-res-title').innerText = t.resTitle;
            document.getElementById('t-save-btn').innerText = t.saveBtn;
            document.getElementById('t-close-modal').innerText = t.closeModal;
            document.getElementById('playerName').placeholder = t.placeholderName;
            
            updateUI();
        }

        // --- FIREBASE KONFIGURACE ---
        const firebaseConfig = {
            databaseURL: "https://dva00-60b6d-default-rtdb.europe-west1.firebasedatabase.app/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // --- HERNÍ PROMĚNNÉ & STAV ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let isDrawing = false;
        let userPoints = [];
        let currentDayKey = new Date().toISOString().slice(0, 10);
        
        // Uživatelská data v LocalStorage
        let userId = localStorage.getItem('nk_userId') || 'user_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('nk_userId', userId);

        let lastPlayDate = localStorage.getItem('nk_lastDate') || '';
        let streak = parseInt(localStorage.getItem('nk_streak') || '0');
        let bonusAttempts = parseInt(localStorage.getItem('nk_bonusAttempts_' + currentDayKey) || '0');
        let attemptsUsed = parseInt(localStorage.getItem('nk_attemptsUsed_' + currentDayKey) || '0');
        let personalBest = parseInt(localStorage.getItem('nk_best_' + currentDayKey) || '0');

        // Správa restartu o půlnoci a sérií
        checkMidnightReset(lastPlayDate);

        // Zpracování Referralu z URL
        const urlParams = new URLSearchParams(window.location.search);
        const refParam = urlParams.get('ref');
        if (refParam && refParam !== userId && !localStorage.getItem('nk_referred_by')) {
            localStorage.setItem('nk_referred_by', refParam);
            // Přičíst bonus pozvateli přes DB
            db.ref('users/' + refParam + '/bonus/' + currentDayKey).transaction(val => (val || 0) + 1);
        }

        // Poslech živých bonusů z Firebase
        db.ref('users/' + userId + '/bonus/' + currentDayKey).on('value', snapshot => {
            const val = snapshot.val();
            if (val !== null) {
                bonusAttempts = val;
                localStorage.setItem('nk_bonusAttempts_' + currentDayKey, bonusAttempts);
                updateUI();
            }
        });

        // --- INICIALIZACE CANVASU ---
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            redrawCanvas();
        }

        // --- DNEŠNÍ SHAPE (GENERÁTOR DENNÍHO UZLU - Lissajous/Knot) ---
        function getDailyTargetPoints(count = 200) {
            const points = [];
            // Unikátní mat. parametrizace dle dne
            const seed = currentDayKey.split('-').reduce((a, b) => parseInt(a) + parseInt(b), 0);
            const a = (seed % 3) + 2; 
            const b = (seed % 4) + 3; 
            const delta = (seed % 5) * Math.PI / 4;

            for (let i = 0; i < count; i++) {
                const t = (i / count) * Math.PI * 2;
                // Lissajous křivka simulující uzel
                let x = Math.sin(a * t + delta);
                let y = Math.sin(b * t);
                points.push({x, y});
            }
            return normalizePoints(points);
        }

        // --- POMOCNÉ MATEMATICKÉ FUNKCE ---
        function normalizePoints(points) {
            if (points.length === 0) return [];
            
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            points.forEach(p => {
                if (p.x < minX) minX = p.x;
                if (p.x > maxX) maxX = p.x;
                if (p.y < minY) minY = p.y;
                if (p.y > maxY) maxY = p.y;
            });

            const width = maxX - minX || 1;
            const height = maxY - minY || 1;
            const scale = Math.max(width, height);
            const centerX = (minX + maxX) / 2;
            const centerY = (minY + maxY) / 2;

            return points.map(p => ({
                x: (p.x - centerX) / scale,
                y: (p.y - centerY) / scale
            }));
        }

        // --- KRESLENÍ & CANVAS ---
        function redrawCanvas(showGhost = false) {
            const w = canvas.getBoundingClientRect().width;
            const h = canvas.getBoundingClientRect().height;
            const center = w / 2;
            const size = w * 0.7;

            ctx.clearRect(0, 0, w, h);

            // Pokud vyhodnocujeme, ukaž cílový uzel jako duch
            if (showGhost) {
                const target = getDailyTargetPoints();
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(176, 38, 255, 0.4)';
                ctx.lineWidth = 6;
                ctx.setLineDash([8, 8]);
                target.forEach((p, i) => {
                    const cx = center + p.x * size;
                    const cy = center + p.y * size;
                    if (i === 0) ctx.moveTo(cx, cy);
                    else ctx.lineTo(cx, cy);
                });
                ctx.closePath();
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Vykreslení uživatelského tahu
            if (userPoints.length > 1) {
                ctx.beginPath();
                ctx.strokeStyle = '#66fcf1';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowColor = '#66fcf1';
                ctx.shadowBlur = 10;

                userPoints.forEach((p, i) => {
                    if (i === 0) ctx.moveTo(p.rawX, p.rawY);
                    else ctx.lineTo(p.rawX, p.rawY);
                });
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }

        // --- EVENT HANDLERY PRO KRESLENÍ ---
        function getMaxAttempts() {
            // Základ 1 + bonus ze série + referral bonusy
            return 1 + Math.floor(streak / 20) + bonusAttempts;
        }

        function startDrawing(e) {
            if (attemptsUsed >= getMaxAttempts()) {
                alert(TRANSLATIONS[currentLang].noAttemptsAlert);
                return;
            }
            isDrawing = true;
            userPoints = [];
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;
            
            userPoints.push({ rawX: x, rawY: y });
            redrawCanvas();
            document.getElementById('submitBtn').disabled = true;
        }

        function draw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
            const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;

            userPoints.push({ rawX: x, rawY: y });
            redrawCanvas();
        }

        function stopDrawing() {
            if (!isDrawing) return;
            isDrawing = false;
            if (userPoints.length > 10) {
                document.getElementById('submitBtn').disabled = false;
            }
        }

        canvas.addEventListener('pointerdown', startDrawing);
        canvas.addEventListener('pointermove', draw);
        canvas.addEventListener('pointerup', stopDrawing);
        canvas.addEventListener('pointerleave', stopDrawing);

        // --- LOGIKA ALGORITMU & POROVNÁNÍ TVARŮ ---
        function submitAttempt() {
            const maxAtt = getMaxAttempts();
            if (attemptsUsed >= maxAtt) return;

            // Převedeme kresbu na relativní body
            const normUser = normalizePoints(userPoints.map(p => ({ x: p.rawX, y: p.rawY })));
            const normTarget = getDailyTargetPoints(normUser.length);

            // Výpočet vzdáleností metodou nejbližších sousedů (Fréchet / Hausdorff aproximace)
            let totalDist = 0;
            normUser.forEach(p => {
                let minDist = Infinity;
                normTarget.forEach(t => {
                    const d = Math.hypot(p.x - t.x, p.y - t.y);
                    if (d < minDist) minDist = d;
                });
                totalDist += minDist;
            });

            const avgDist = totalDist / normUser.length;
            // Výpočet skóre v procentech (s tolerancí)
            let score = Math.max(0, Math.min(100, Math.round((1 - (avgDist / 0.25)) * 100)));

            // Započítání tahu a změna stavu
            attemptsUsed++;
            localStorage.setItem('nk_attemptsUsed_' + currentDayKey, attemptsUsed);
            
            if (score > personalBest) {
                personalBest = score;
                localStorage.setItem('nk_best_' + currentDayKey, personalBest);
            }

            // Aktualizace série
            if (lastPlayDate !== currentDayKey) {
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                const yKey = yesterday.toISOString().slice(0, 10);
                
                if (lastPlayDate === yKey) {
                    streak++;
                } else if (lastPlayDate === '') {
                    streak = 1;
                } else {
                    streak = 1; // Přerušená série
                }
                
                lastPlayDate = currentDayKey;
                localStorage.setItem('nk_lastDate', lastPlayDate);
                localStorage.setItem('nk_streak', streak);
            }

            // Vykreslení canvasu s duchem výsledného tvaru
            redrawCanvas(true);
            updateUI();

            // Zvýšit globální čítač v DB
            db.ref('global/totalAttempts').transaction(val => (val || 0) + 1);

            // Zobrazení Modal okna
            document.getElementById('resScore').innerText = score + '%';
            document.getElementById('resText').innerText = TRANSLATIONS[currentLang].resTextSuccess;
            document.getElementById('resultModal').style.display = 'flex';
            document.getElementById('submitBtn').disabled = true;
            
            // Uložení skóre pro posouzení v DB
            window.lastCalculatedScore = score;
        }

        // --- ULOŽENÍ VÝSLEDKU DO FIREBASE LEADERBOARDU ---
        function saveResult() {
            const nameInput = document.getElementById('playerName').value.trim() || 'Neznámý';
            const score = window.lastCalculatedScore || 0;

            // Zmenšení náhledu na miniaturní WebP obrázek
            const miniCanvas = document.createElement('canvas');
            miniCanvas.width = 80;
            miniCanvas.height = 80;
            const mCtx = miniCanvas.getContext('2d');
            mCtx.drawImage(canvas, 0, 0, 80, 80);
            const dataUrl = miniCanvas.toDataURL('image/webp', 0.5);

            // Uložení do Firebase pod dnešní den
            const lbRef = db.ref('leaderboard/' + currentDayKey + '/' + userId);
            lbRef.set({
                name: nameInput,
                score: score,
                img: dataUrl,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });

            document.getElementById('resultModal').style.display = 'none';
        }

        // --- LEADERBOARD & REALTIME LOGIKA ---
        function loadLeaderboard() {
            db.ref('leaderboard/' + currentDayKey)
                .orderByChild('score')
                .limitToLast(10)
                .on('value', snapshot => {
                    const list = document.getElementById('leaderboardList');
                    list.innerHTML = '';

                    if (!snapshot.exists()) {
                        list.innerHTML = `<li class="lb-item" style="justify-content:center; color:#666;">Zatím žádné výsledky. Buď první!</li>`;
                        return;
                    }

                    let entries = [];
                    snapshot.forEach(child => {
                        entries.push(child.val());
                    });
                    
                    // Řazení od nejvyššího skóre
                    entries.sort((a, b) => b.score - a.score);

                    entries.forEach((item, index) => {
                        const li = document.createElement('li');
                        li.className = 'lb-item';
                        
                        const imgTag = item.img ? `<img src="${item.img}" class="lb-thumb" onclick="showPreview('${item.img}')">` : '';
                        
                        li.innerHTML = `
                            <span class="lb-rank">${index + 1}.</span>
                            ${imgTag}
                            <span class="lb-name">${escapeHtml(item.name)}</span>
                            <span class="lb-score">${item.score}%</span>
                        `;
                        list.appendChild(li);
                    });
                });

            // Globální statistika
            db.ref('global/totalAttempts').on('value', snapshot => {
                document.getElementById('globalTotalAttempts').innerText = snapshot.val() || 0;
            });
        }

        function showPreview(src) {
            document.getElementById('previewImg').src = src;
            document.getElementById('imageModal').style.display = 'flex';
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // --- RESET O PŮLNOCI A UTILS ---
        function checkMidnightReset(lastDate) {
            if (lastDate && lastDate !== currentDayKey) {
                // Skontrolovat zda nedošlo k přerušení série
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                const yKey = yesterday.toISOString().slice(0, 10);

                if (lastDate !== yKey) {
                    streak = 0;
                    localStorage.setItem('nk_streak', '0');
                }
            }
        }

        function updateUI() {
            const maxAtt = getMaxAttempts();
            document.getElementById('attempts-val').innerText = `${attemptsUsed}/${maxAtt}`;
            document.getElementById('streak-val').innerText = `${streak} ${TRANSLATIONS[currentLang].days}`;
            document.getElementById('best-val').innerText = `${personalBest}%`;

            // Referral Link
            const refUrl = window.location.origin + window.location.pathname + '?ref=' + userId;
            document.getElementById('refLink').innerText = refUrl;
        }

        function copyRefLink() {
            const refUrl = window.location.origin + window.location.pathname + '?ref=' + userId;
            navigator.clipboard.writeText(refUrl).then(() => {
                alert(TRANSLATIONS[currentLang].copied);
            });
        }

        // --- START APLIKACE ---
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('DOMContentLoaded', () => {
            resizeCanvas();
            updateUI();
            loadLeaderboard();
        });
    </script>
</body>
</html>
