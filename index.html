<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Knot Drawing - 10-Day Cycle</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121214;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        /* HORNÍ LIŠTA */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,0));
            pointer-events: none;
        }
        .hud-item {
            display: flex;
            flex-direction: column;
        }
        .hud-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a0a0ab;
        }
        .hud-value {
            font-size: 18px;
            font-weight: 700;
            color: #00f0ff;
            text-shadow: 0 0 8px rgba(0,240,255,0.4);
        }

        /* NÁHLED PŘÍŠTÍHO TVARU V HORNÍ LIŠTĚ */
        .next-shape-preview {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.07);
            padding: 6px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
        }
        .next-preview-canvas {
            width: 44px;
            height: 44px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border: 1px solid rgba(0, 240, 255, 0.3);
        }

        /* OVLÁDACÍ TLAČÍTKA */
        .controls-overlay {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 15px;
        }
        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.2s ease;
            pointer-events: auto;
        }
        .btn:active {
            transform: scale(0.95);
            background: rgba(0, 240, 255, 0.3);
        }

        /* VÝSLEDKOVÉ OKNO */
        .result-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(20, 20, 25, 0.95);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .result-modal.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }
        .score-big {
            font-size: 48px;
            font-weight: 900;
            color: #00f0ff;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <!-- HORNÍ LIŠTA -->
    <div class="top-bar">
        <div class="hud-item">
            <span class="hud-label">Do nového cyklu</span>
            <span class="hud-value" id="cycle-timer">--d --h --m</span>
        </div>

        <!-- Náhled příštího tvaru v liště -->
        <div class="next-shape-preview">
            <div class="hud-item" style="text-align: right;">
                <span class="hud-label">Další výzva</span>
                <span class="hud-value" style="font-size: 13px; color: #aaa;" id="next-shape-name">---</span>
            </div>
            <canvas id="nextShapeCanvas" class="next-preview-canvas" width="88" height="88"></canvas>
        </div>

        <div class="hud-item" style="text-align: right;">
            <span class="hud-label">Skóre</span>
            <span class="hud-value" id="live-score">0%</span>
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="controls-overlay">
        <button class="btn" id="clear-btn">Vymazat</button>
        <button class="btn" id="evaluate-btn" style="background: #00f0ff; color: #000;">Vyhodnotit</button>
    </div>

    <div class="result-modal" id="result-modal">
        <h2>Přesnost kresby</h2>
        <div class="score-big" id="modal-score">0%</div>
        <p id="modal-msg" style="color: #aaa; margin-bottom: 20px;">Dobrá práce!</p>
        <button class="btn" id="close-modal-btn" style="background: #00f0ff; color: #000;">Zkusit znovu</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextShapeCanvas');
        const nextCtx = nextCanvas.getContext('2d');

        const CYCLE_DAYS = 10;
        let userPoints = [];
        let isDrawing = false;
        let currentTargetPoints = [];
        let nextTargetPoints = [];

        // 1. VÝPOČET CYKLU
        function getCurrentCycleIndex() {
            const now = new Date().getTime();
            return Math.floor(now / (1000 * 60 * 60 * 24 * CYCLE_DAYS));
        }

        function getNextCycleTime() {
            const currentCycle = getCurrentCycleIndex();
            return (currentCycle + 1) * (1000 * 60 * 60 * 24 * CYCLE_DAYS);
        }

        function updateTimer() {
            const now = Date.now();
            const diff = getNextCycleTime() - now;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

            document.getElementById('cycle-timer').innerText = `${days}d ${hours}h ${mins}m`;
        }
        setInterval(updateTimer, 60000);
        updateTimer();

        // 2. GENERÁTOR TVARŮ (PŮVODNÍ NEKONECNÝ UZEL JAKO PRVNÍ TRVALÝ VYCHOZÍ TVAR)
        function generateShapePoints(cycleIndex, width, height) {
            const points = [];
            const count = 300;
            const shapeType = Math.abs(cycleIndex) % 4; // 0: Nekonečný uzel, 1: Srdce, 2: Růže, 3: Hvězda
            const scale = Math.min(width, height) * 0.35;
            const cx = width / 2;
            const cy = height / 2;

            for (let i = 0; i < count; i++) {
                const t = (i / count) * Math.PI * 2;
                let x = 0, y = 0;

                if (shapeType === 0) {
                    // PŮVODNÍ NEKONEČNÝ UZEL (Z prvního kódu)
                    x = Math.sin(t) + 2 * Math.sin(2 * t);
                    y = Math.cos(t) - 2 * Math.cos(2 * t);
                    x *= scale / 3.2;
                    y *= scale / 3.2;
                } else if (shapeType === 1) {
                    // SRDCE
                    x = 16 * Math.pow(Math.sin(t), 3);
                    y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                    x *= scale / 18;
                    y *= scale / 18;
                } else if (shapeType === 2) {
                    // RŮŽICE
                    const r = Math.sin(3 * t);
                    x = r * Math.cos(t) * scale;
                    y = r * Math.sin(t) * scale;
                } else if (shapeType === 3) {
                    // HVĚZDA
                    const r = 0.6 + 0.4 * Math.sin(5 * t);
                    x = r * Math.cos(t) * scale;
                    y = r * Math.sin(t) * scale;
                }

                points.push({ x: cx + x, y: cy + y });
            }
            return { points, name: getShapeName(shapeType) };
        }

        function getShapeName(type) {
            return ["Nekonečný uzel", "Srdce", "Růžice", "Hvězda"][type];
        }

        // 3. RESIZE A VYKRESLOVÁNÍ
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const cycle = getCurrentCycleIndex();
            const currentData = generateShapePoints(cycle, canvas.width, canvas.height);
            currentTargetPoints = currentData.points;

            // Příští tvar do náhledu
            const nextData = generateShapePoints(cycle + 1, nextCanvas.width, nextCanvas.height);
            nextTargetPoints = nextData.points;
            document.getElementById('next-shape-name').innerText = nextData.name;

            drawNextPreview();
            redraw();
        }

        function drawNextPreview() {
            nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
            if (nextTargetPoints.length === 0) return;

            nextCtx.beginPath();
            nextCtx.strokeStyle = '#00f0ff';
            nextCtx.lineWidth = 2;
            nextCtx.shadowColor = '#00f0ff';
            nextCtx.shadowBlur = 4;

            nextCtx.moveTo(nextTargetPoints[0].x, nextTargetPoints[0].y);
            for (let p of nextTargetPoints) {
                nextCtx.lineTo(p.x, p.y);
            }
            nextCtx.closePath();
            nextCtx.stroke();
        }

        function redraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vzorový tvar
            if (currentTargetPoints.length > 0) {
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.lineWidth = 14;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.moveTo(currentTargetPoints[0].x, currentTargetPoints[0].y);
                for (let p of currentTargetPoints) {
                    ctx.lineTo(p.x, p.y);
                }
                ctx.closePath();
                ctx.stroke();
            }

            // Kresba uživatele
            if (userPoints.length > 0) {
                ctx.beginPath();
                ctx.strokeStyle = '#00f0ff';
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowColor = '#00f0ff';
                ctx.shadowBlur = 10;
                ctx.moveTo(userPoints[0].x, userPoints[0].y);
                for (let p of userPoints) {
                    ctx.lineTo(p.x, p.y);
                }
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }

        // 4. INTERAKCE KRESLENÍ
        function startDrawing(e) {
            isDrawing = true;
            userPoints = [];
            addPoint(e);
        }

        function draw(e) {
            if (!isDrawing) return;
            addPoint(e);
            redraw();
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function addPoint(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            userPoints.push({
                x: clientX - rect.left,
                y: clientY - rect.top
            });
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });
        canvas.addEventListener('touchend', stopDrawing);

        document.getElementById('clear-btn').addEventListener('click', () => {
            userPoints = [];
            document.getElementById('live-score').innerText = '0%';
            redraw();
        });

        // 5. VYHODNOCENÍ
        document.getElementById('evaluate-btn').addEventListener('click', () => {
            if (userPoints.length < 10) return;

            let totalDist = 0;
            for (let up of userPoints) {
                let minDist = Infinity;
                for (let tp of currentTargetPoints) {
                    const d = Math.hypot(up.x - tp.x, up.y - tp.y);
                    if (d < minDist) minDist = d;
                }
                totalDist += minDist;
            }

            const avgDist = totalDist / userPoints.length;
            const maxAllowedDist = 50; 
            let accuracy = Math.max(0, 100 - (avgDist / maxAllowedDist) * 100);
            accuracy = Math.round(accuracy);

            document.getElementById('live-score').innerText = `${accuracy}%`;
            document.getElementById('modal-score').innerText = `${accuracy}%`;
            document.getElementById('result-modal').classList.add('active');
        });

        document.getElementById('close-modal-btn').addEventListener('click', () => {
            document.getElementById('result-modal').classList.remove('active');
        });

        window.addEventListener('resize', resize);
        resize();
    </script>
</body>
</html>
